name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The store signing key, base64-encoded. Absent on forks and until it is
      # added under Settings → Secrets and variables → Actions.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Fetch the offline speech model
        run: |
          set -eu
          url=https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          curl -fsSL --retry 3 --retry-delay 5 -o model.zip "$url"
          unzip -q model.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          du -sh app/src/main/assets/model-en-us

      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sayword-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # The store build. Without the real key it is signed with a throwaway
      # one, only to prove it still builds, and is not uploaded.
      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          keystore="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          else
            echo "::notice::No KEYSTORE_BASE64 secret: signing with a throwaway key just to check the release build."
            export SIGNING_STORE_PASSWORD=throwaway SIGNING_KEY_PASSWORD=throwaway SIGNING_KEY_ALIAS=throwaway
            keytool -genkeypair -keystore "$keystore" -alias throwaway -keyalg RSA -keysize 2048 \
              -validity 1 -storepass throwaway -keypass throwaway -dname "CN=throwaway" -noprompt
          fi
          SIGNING_STORE_FILE="$keystore" gradle assembleRelease
          rm -f "$keystore"
          ls -la app/build/outputs/apk/release/

      - name: Upload release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: sayword-release
          path: app/build/outputs/apk/release/app-release.apk
