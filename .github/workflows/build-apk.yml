name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Fetch the offline speech model
        run: |
          set -eu
          url=https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          curl -fsSL --retry 3 --retry-delay 5 -o model.zip "$url"
          unzip -q model.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          du -sh app/src/main/assets/model-en-us
          ls -la app/src/main/assets/model-en-us/graph

      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sayword-debug
          path: app/build/outputs/apk/debug/app-debug.apk
